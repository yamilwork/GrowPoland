    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes dash { to { stroke-dashoffset: 1000; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
        
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        .zoom-in { animation: zoomIn 0.4s ease-out forwards; }
        .path-anim { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: dash 5s linear infinite reverse; }
        .node-pulse { animation: pulse 2s infinite; transform-origin: center; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .hero-gradient { background: linear-gradient(to right, #0f172a 0%, rgba(15, 23, 42, 0.8) 50%, transparent 100%); }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
