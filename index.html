    <title>GrowPoland Investment | Global E-commerce Holding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes dashflow { 
            from { stroke-dashoffset: 60; } 
            to { stroke-dashoffset: 0; } 
        }
        @keyframes pulse-soft { 
            0% { transform: scale(1); opacity: 0.3; } 
            50% { transform: scale(1.8); opacity: 0; } 
            100% { transform: scale(1); opacity: 0; } 
        }
        
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        .zoom-in { animation: zoomIn 0.4s ease-out forwards; }
        
        /* Flujo más lento y discreto */
        .path-anim { 
            stroke-dasharray: 2, 8; 
            animation: dashflow 5s linear infinite; 
        }
        
        .node-pulse-ring { 
            transform-origin: center;
            animation: pulse-soft 3s ease-out infinite; 
        }

        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 4px; }
    </style>
